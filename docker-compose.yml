version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: spetion
      POSTGRES_PASSWORD: spetion
      POSTGRES_DB: spetion_exam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spetion
      MINIO_ROOT_PASSWORD: spetion123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  pgdata:
  minio-data:
